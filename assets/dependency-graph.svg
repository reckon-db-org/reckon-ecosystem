<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="dep" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#94a3b8"/>
    </marker>
    <marker id="depOpt" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#f59e0b" opacity="0.6"/>
    </marker>
    <marker id="depRun" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#38bdf8" opacity="0.7"/>
    </marker>
  </defs>

  <rect width="900" height="960" fill="url(#bgGrad3)"/>
  <g opacity="0.06">
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.5"/>
    </pattern>
    <rect width="900" height="960" fill="url(#grid3)"/>
  </g>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#fff">
    Dependency Graph
  </text>
  <text x="450" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Build order flows top to bottom. Arrows point from dependent to dependency.
  </text>

  <!-- Level 0: No deps -->
  <text x="70" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Level 0</text>
  <text x="70" y="125" font-family="system-ui, sans-serif" font-size="9" fill="#475569">No dependencies</text>

  <!-- reckon_nifs -->
  <g filter="url(#shadow3)">
    <rect x="180" y="95" width="220" height="50" rx="10" fill="#92400e"/>
    <text x="290" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fff">reckon_nifs</text>
    <text x="290" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fde68a">Rust NIFs &#xb7; v2.0.1</text>
  </g>

  <!-- evoq (also no reckon deps) -->
  <g filter="url(#shadow3)">
    <rect x="500" y="95" width="220" height="50" rx="10" fill="#065f46"/>
    <text x="610" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fff">evoq</text>
    <text x="610" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0">CQRS + DCB/CCC &#xb7; v1.23.0</text>
  </g>

  <!-- Level 1: shared types -->
  <text x="70" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Level 1</text>
  <text x="70" y="225" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Shared types</text>

  <!-- reckon_gater -->
  <g filter="url(#shadow3)">
    <rect x="340" y="195" width="220" height="50" rx="10" fill="#0c4a6e"/>
    <text x="450" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fff">reckon_gater</text>
    <text x="450" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#bae6fd">Types + DCB/CCC tag_filter &#xb7; v3.10.0</text>
  </g>

  <!-- Level 2: core -->
  <text x="70" y="320" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Level 2</text>
  <text x="70" y="335" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Event store</text>

  <!-- reckon_db -->
  <g filter="url(#shadow3)">
    <rect x="180" y="305" width="220" height="50" rx="10" fill="#4c1d95"/>
    <text x="290" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fff">reckon_db</text>
    <text x="290" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#e9d5ff">Event store + self-healing &#xb7; v5.9.0</text>
  </g>

  <!-- Level 3: adapter -->
  <text x="70" y="430" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Level 3</text>
  <text x="70" y="445" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Integration</text>

  <!-- reckon_evoq -->
  <g filter="url(#shadow3)">
    <rect x="340" y="415" width="220" height="50" rx="10" fill="#831843"/>
    <text x="450" y="438" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fff">reckon_evoq</text>
    <text x="450" y="455" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fce7f3">Adapter &#xb7; v2.7.0</text>
  </g>

  <!-- Level 4: deployable gateway -->
  <text x="70" y="540" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Level 4</text>
  <text x="70" y="555" font-family="system-ui, sans-serif" font-size="9" fill="#475569">gRPC ingress</text>

  <!-- reckon_gateway -->
  <g filter="url(#shadow3)">
    <rect x="500" y="525" width="220" height="50" rx="10" fill="#1e40af"/>
    <text x="610" y="548" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fff">reckon_gateway</text>
    <text x="610" y="565" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#bfdbfe">gRPC ingress + catalogue &#xb7; v0.27.0</text>
  </g>

  <!-- Level 5: wire contract -->
  <text x="70" y="650" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Level 5</text>
  <text x="70" y="665" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Wire contract</text>

  <!-- reckon_proto -->
  <g filter="url(#shadow3)">
    <rect x="340" y="635" width="220" height="50" rx="10" fill="#334155"/>
    <text x="450" y="658" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fff">reckon_proto</text>
    <text x="450" y="675" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">gRPC .proto contract &#xb7; v0.8.0</text>
  </g>

  <!-- Level 6: polyglot clients -->
  <text x="70" y="765" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Level 6</text>
  <text x="70" y="780" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Polyglot clients</text>

  <!-- reckon-go -->
  <g filter="url(#shadow3)">
    <rect x="40" y="750" width="185" height="48" rx="10" fill="#155e75"/>
    <text x="132" y="772" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">reckon-go</text>
    <text x="132" y="788" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#a5f3fc">Go client &#xb7; v0.9.0</text>
  </g>

  <!-- reckon-lazy -->
  <g filter="url(#shadow3)">
    <rect x="245" y="750" width="185" height="48" rx="10" fill="#134e4a"/>
    <text x="337" y="772" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">reckon-lazy</text>
    <text x="337" y="788" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#99f6e4">TUI (lazyreckon) &#xb7; v0.4.0</text>
  </g>

  <!-- reckon-dotnet -->
  <g filter="url(#shadow3)">
    <rect x="450" y="750" width="185" height="48" rx="10" fill="#5b21b6"/>
    <text x="542" y="772" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">reckon-dotnet</text>
    <text x="542" y="788" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ddd6fe">.NET client &#xb7; v0.1.0</text>
  </g>

  <!-- reckon-py -->
  <g filter="url(#shadow3)">
    <rect x="655" y="750" width="185" height="48" rx="10" fill="#1e3a8a"/>
    <text x="747" y="772" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">reckon-py</text>
    <text x="747" y="788" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#bfdbfe">Python client &#xb7; v0.1.0</text>
  </g>

  <!-- === DEPENDENCY ARROWS === -->

  <!-- reckon_db -> reckon_gater (required) -->
  <line x1="340" y1="305" x2="420" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#dep)"/>
  <text x="352" y="278" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">~> 3.10</text>

  <!-- reckon_db -> reckon_nifs (optional) -->
  <line x1="290" y1="305" x2="290" y2="145" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5" marker-end="url(#depOpt)"/>
  <text x="225" y="230" font-family="system-ui, sans-serif" font-size="9" fill="#f59e0b" opacity="0.7">optional</text>

  <!-- reckon_evoq -> reckon_gater -->
  <line x1="450" y1="415" x2="450" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#dep)"/>
  <text x="458" y="340" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">~> 3.x</text>

  <!-- reckon_evoq -> evoq -->
  <line x1="530" y1="415" x2="590" y2="145" stroke="#94a3b8" stroke-width="2" marker-end="url(#dep)"/>
  <text x="575" y="285" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">~> 1.23</text>

  <!-- reckon_gateway -> reckon_gater (required) -->
  <line x1="560" y1="525" x2="500" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#dep)"/>
  <text x="540" y="385" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">~> 3.7</text>

  <!-- reckon_gateway -> reckon_db (optional, embedded mode only) -->
  <line x1="510" y1="525" x2="385" y2="355" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5" marker-end="url(#depOpt)"/>
  <text x="392" y="500" font-family="system-ui, sans-serif" font-size="9" fill="#f59e0b" opacity="0.85">optional (embedded)</text>

  <!-- reckon_gateway -> reckon_proto (server stubs, required) -->
  <line x1="590" y1="575" x2="500" y2="640" stroke="#94a3b8" stroke-width="2" marker-end="url(#dep)"/>
  <text x="560" y="612" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">v0.8 stubs</text>

  <!-- clients generate from reckon_proto (build dep) -->
  <line x1="132" y1="750" x2="360" y2="685" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dep)"/>
  <line x1="542" y1="750" x2="470" y2="685" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dep)"/>
  <line x1="747" y1="750" x2="540" y2="685" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dep)"/>
  <text x="330" y="720" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">generate stubs</text>

  <!-- reckon-lazy -> reckon-go (built on) -->
  <line x1="245" y1="774" x2="225" y2="774" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dep)"/>

  <!-- clients -> gateway (runtime gRPC connect) -->
  <line x1="770" y1="750" x2="690" y2="575" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" marker-end="url(#depRun)"/>
  <text x="712" y="660" font-family="system-ui, sans-serif" font-size="9" fill="#38bdf8" opacity="0.85">runtime gRPC :50051</text>

  <!-- Legend -->
  <g transform="translate(70, 835)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Legend</text>

    <line x1="0" y1="20" x2="50" y2="20" stroke="#94a3b8" stroke-width="2"/>
    <text x="60" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Build dependency</text>

    <line x1="220" y1="20" x2="270" y2="20" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.7"/>
    <text x="280" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">Optional dependency</text>

    <line x1="470" y1="20" x2="520" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
    <text x="530" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">Runtime gRPC connect</text>
  </g>

  <!-- Key insight -->
  <g transform="translate(70, 888)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">
      Key: reckon_evoq bridges evoq + reckon_gater (NOT reckon_db directly). reckon_gateway serves the
    </text>
    <text x="0" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">
      reckon_proto contract; catalogue mode is the default, embedded reckon_db is opt-in. Every polyglot client
    </text>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">
      generates stubs from reckon_proto at build time and connects to a running gateway over gRPC at runtime.
    </text>
  </g>

  <text x="850" y="935" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#475569">
    reckon_ecosystem v0.4.0 &#xb7; 2026-07-06
  </text>
</svg>
